[project]
name = "turtlex"
version = "1.0.0"
description = "Backtest different US stocks trading strategies"
authors = [{ name = "Jaak Niit", email = "jaak.niit@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "tenacity>=9.2.1",               # retry logic in turtlex/client/eodhd.py
    "python-dotenv>=1.2.4",
    "psycopg[binary,pool]>=3.3.6",
    "sqlalchemy[asyncio]>=2.1.6",
    "alembic>=1.20.1",
    "pandas>=3.1.0,<4",              # quantstats/analytics; must match pandas-stubs major
    "numpy>=2.5.4,<3",               # used by analytics + research scripts
    "setuptools>=84.2.1",
    "quantstats>=0.0.86",          # Portfolio analytics for quantitative analysis
    "pydantic>=2.14.1",
    "polars>=2.0.0",
]

[project.optional-dependencies]
lint = ["ruff>=0.17.2", "mypy>=2.4.0"]

[project.scripts]
signal-runner = "turtlex.cli.signal_runner:main"
download-eodhd-data = "turtlex.cli.download_eodhd_data:main"
snapshot-company = "turtlex.cli.snapshot_company:main"
portfolio-runner = "turtlex.cli.portfolio_runner:main"
backtest-runner = "turtlex.cli.backtest_runner:main"
lightyear-import = "turtlex.cli.import_lightyear:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turtlex"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:websockets.legacy.*"]
addopts = ["-m", "not bruno"]
markers = [
    "bruno: runs the Bruno CLI against the real EODHD API (requires bru + EODHD_API_KEY); excluded by default, run with `-m bruno`",
]

[tool.ruff]
target-version = "py314"
line-length = 140
lint.select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
exclude = [
    "db/migrations",
    ".venv",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["turtlex", "scripts"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260914,<4",  # must match pandas major version
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "types-requests>=2.33.0.20261006",
]
