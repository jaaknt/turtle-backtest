[project]
name = "turtle"
version = "1.0.0"
description = "Backtest different US stocks trading strategies"
authors = [{ name = "Jaak Niit", email = "jaak.niit@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "psycopg[binary,pool]>=3.3.4",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.5",
    "pandas>=3.0.3,<4",              # streamlit requires pandas<4
    "numpy<3",                       # streamlit requires numpy<3
    "streamlit>=1.59.2",
    "setuptools>=83.0.0",
    "backtesting>=0.6.5",
    "bokeh>=3.9.1",
    "plotly>=6.9.0",
    "quantstats>=0.0.81",          # Portfolio analytics for quantitative analysis
    "pydantic>=2.13.4",
    "polars>=1.42.1",
]

[project.optional-dependencies]
dev = ["jupyter>=1.1.1"]
lint = ["ruff>=0.15.22", "mypy>=2.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["turtle"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning:websockets.legacy.*"]
addopts = ["-m", "not bruno"]
markers = [
    "bruno: runs the Bruno CLI against the real EODHD API (requires bru + EODHD_API_KEY); excluded by default, run with `-m bruno`",
]

[tool.ruff]
target-version = "py314"
line-length = 140
lint.select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
exclude = [
    "db/migrations",
    ".venv",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["turtle", "scripts"]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530,<4",  # must match pandas major version
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "types-requests>=2.33.0.20260712",
]
