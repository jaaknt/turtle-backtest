# Base configuration: complete, working defaults (localhost Postgres).
# Set ACTIVE_PROFILE=<name> to layer config/settings-<name>.toml over this file;
# the overlay only needs the keys it changes.
# Secrets are never stored here — DB_APP_PASSWORD and EODHD_API_KEY come from the environment.
[app]
name = "turtle-backtest"
debug = true
eodhd.api_key = "YOUR_EODHD_API_KEY"

[database]
host = "localhost"
port = 5432
dbname = "trading"
user = "app_user"

[database.pool]
min_size = 10
max_size = 30
max_idle = 300
max_lifetime = 3600
timeout = 30

[job_runs]
enabled = false
