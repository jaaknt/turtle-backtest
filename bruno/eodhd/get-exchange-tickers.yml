info:
  name: Get exchange tickers
  type: http
  seq: 4
  tags: [positive]

http:
  method: GET
  url: https://eodhd.com/api/exchange-symbol-list/US?api_token={{process.env.EODHD_API_KEY}}&fmt=json
  params:
    - name: api_token
      value: "{{process.env.EODHD_API_KEY}}"
      type: query
    - name: fmt
      value: json
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns a non-empty array of tickers", function() {
          expect(res.body).to.be.an('array').that.is.not.empty;
        });
        test("each ticker has all fields turtlex/schema/eodhd/ticker.py uses", function() {
          const ticker = res.body[0];
          const fields = ['Code', 'Name', 'Country', 'Exchange', 'Currency', 'Type', 'Isin'];
          fields.forEach(function(field) {
            expect(ticker).to.have.property(field);
          });
        });
