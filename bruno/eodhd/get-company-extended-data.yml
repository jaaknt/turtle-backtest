info:
  name: Get company extended data
  type: http
  seq: 2
  tags: [positive]

http:
  method: GET
  url: https://eodhd.com/api/us-quote-delayed?s=AMZN.US&api_token={{process.env.EODHD_API_KEY}}&fmt=json
  params:
    - name: s
      value: AMZN.US
      type: query
    - name: api_token
      value: "{{process.env.EODHD_API_KEY}}"
      type: query
    - name: fmt
      value: json
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("response has a data.AMZN.US entry", function() {
          expect(res.body).to.have.property('data');
          expect(res.body.data).to.have.property('AMZN.US');
        });
        test("AMZN.US entry has all fields turtlex/schema/eodhd/company.py uses", function() {
          const company = res.body.data['AMZN.US'];
          const fields = [
            'symbol', 'type', 'name', 'sector', 'industry',
            'averageVolume', 'fiftyDayAveragePrice', 'dividendYield',
            'marketCap', 'pe', 'forwardPE'
          ];
          fields.forEach(function(field) {
            expect(company).to.have.property(field);
          });
        });
