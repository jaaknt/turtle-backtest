info:
  name: Get exchanges list
  type: http
  seq: 3
  tags: [positive]

http:
  method: GET
  url: https://eodhd.com/api/exchanges-list?api_token={{process.env.EODHD_API_KEY}}&fmt=json
  params:
    - name: api_token
      value: "{{process.env.EODHD_API_KEY}}"
      type: query
    - name: fmt
      value: json
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns a non-empty array of exchanges", function() {
          expect(res.body).to.be.an('array').that.is.not.empty;
        });
        test("each exchange has all fields turtle/schema/eodhd/exchange.py uses", function() {
          const exchange = res.body[0];
          const fields = ['Name', 'Code', 'Country', 'Currency', 'CountryISO3'];
          fields.forEach(function(field) {
            expect(exchange).to.have.property(field);
          });
        });
