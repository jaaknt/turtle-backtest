version: 2

# Every ecosystem: a release is proposed only once it is 7 days old, so a hijacked version is
# usually caught and yanked before it reaches a PR; and minor and patch updates arrive as one
# grouped PR, while each major gets its own PR (and its own CI failure).
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
