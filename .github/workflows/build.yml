name: Build

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --extra lint

      - name: Run ruff linter
        run: uv run ruff check turtlex/ scripts/

      # docs/ and the root *.md are included because ruff formats Python inside markdown fenced
      # blocks, and a snippet drifting from the code it documents is exactly what that catches.
      # The glob is unquoted so the shell expands it, which keeps a newly added root doc covered
      # without editing this file. The linter above stays narrow: `ruff check` does not read
      # markdown, so those paths would match no files there.
      - name: Run ruff formatter check
        run: uv run ruff format --check turtlex/ scripts/ docs/ *.md

      - name: Run markdown linter
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            CLAUDE.md
            docs/**/*.md
            .claude/commands/*.md
            .claude/skills/**/*.md

      - name: Run mypy for static type checking
        run: uv run mypy turtlex/ scripts/

      - name: Run tests
        run: uv run pytest
