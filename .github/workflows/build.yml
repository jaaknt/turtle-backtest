name: Build

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Install dependencies
        run: uv sync --extra dev --extra lint

      - name: Run ruff linter
        run: uv run ruff check turtlex/ scripts/

      - name: Run ruff formatter check
        run: uv run ruff format --check turtlex/ scripts/

      - name: Run markdown linter
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            CLAUDE.md
            docs/**/*.md
            .claude/commands/*.md

      - name: Run mypy for static type checking
        run: uv run mypy turtlex/ scripts/

      - name: Run tests
        run: uv run pytest
